; Timeblaster — Arduino Nano ESP32 firmware
;
; Matches the toolchain the display driver was developed and proven with, so
; src/SevenSegment.{h,cpp} can be carried across unmodified.
;
;   pio run                 build
;   pio run -t upload       flash the Nano
;   pio device monitor      watch the TB1 link (stop timeblaster.service first)

[env:arduino_nano_esp32]
platform = espressif32
board = arduino_nano_esp32
framework = arduino

; USB CDC ignores the rate, but the monitor speed should match the Pi's.
monitor_speed = 115200

build_flags =
    -Wall
