# Bounded persistent logging for an always-on appliance.
#
# Raspberry Pi OS ships /usr/lib/systemd/journald.conf.d/40-rpi-volatile-storage.conf
# setting Storage=volatile, to spare the SD card the write wear of a persistent
# journal. That does keep logs off the disk entirely, but it also means every log
# is lost at reboot -- and a device meant to run unattended for months is exactly
# the one whose last boot you need to read. A Nano fault here went undiagnosed
# for 15 hours and was only explainable because the Pi happened not to reboot.
#
# This file overrides that default: /etc is read after /usr/lib, and 99 sorts
# after 40.
[Journal]
Storage=persistent

# The cap. Without this, SystemMaxUse defaults to 10% of the filesystem, which
# on a 469GB card would be 46GB.
SystemMaxUse=200M
SystemMaxFileSize=20M

# This line is the one that matters most, and the reason this file cannot just
# set Storage=persistent and stop.
#
# SystemKeepFree defaults to 15% of the filesystem. The card is 469GB, so the
# default demands ~70GB free before journald will write anything -- and this
# device runs with around 15GB free because the rest is media. Left at the
# default, enabling persistent storage would silently log nothing at all, which
# is worse than volatile: it looks like it works.
SystemKeepFree=1G

# Age bound as well as a size bound, so a quiet device does not keep a year of
# uneventful logs just because they fit.
MaxRetentionSec=1month

# The runtime journal still exists before /var is available at boot. Keep it
# modest: it is RAM.
RuntimeMaxUse=64M
