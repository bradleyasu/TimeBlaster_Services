# Load the USB CDC-ACM driver at boot, before any service starts.
#
# The Nano appears as /dev/ttyACM0, whose major number comes from this module.
# Without it the module only loads on demand, when the device first enumerates.
#
# That is a problem because timeblaster.service hardens itself with
#
#   DeviceAllow=char-ttyACM rw
#
# and systemd resolves "char-ttyACM" by looking "ttyACM" up in /proc/devices at
# the moment it builds the service's cgroup device filter. If cdc_acm has not
# loaded yet there is no such entry, systemd silently drops the rule, and the
# filter is fixed for the lifetime of the process. The device then appears
# seconds later and every open() of it returns EPERM -- forever, however many
# times the daemon retries -- until the service is restarted.
#
# Measured on this hardware: service started at 7.1s, cdc_acm loaded at 23.6s,
# and the daemon then failed to open the port for as long as it was left alone.
cdc_acm
